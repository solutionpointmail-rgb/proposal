name: Push Selector Page

on:
  repository_dispatch:
    types: [push-selector]

permissions:
  contents: write

jobs:
  push-file:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow .html files
        env:
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          case "$FILENAME" in
            *.html) echo "OK: $FILENAME" ;;
            *) echo "Blocked non-HTML file: $FILENAME"; exit 1 ;;
          esac

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch file from Dropbox and write
        env:
          DROPBOX_URL: ${{ github.event.client_payload.dropbox_url }}
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          echo "Fetching $FILENAME from Dropbox..."
          curl -L -o "$FILENAME" "$DROPBOX_URL"
          echo "✅ Downloaded $(wc -c < $FILENAME) bytes"

      - name: Commit and push
        env:
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          git config user.name "TBG Proposal Bot"
          git config user.email "solutionpointmail@gmail.com"
          git add "$FILENAME"
          git diff --staged --quiet || git commit -m "Auto: selector page for $FILENAME"
          git push
          echo "✅ Pushed $FILENAME to GitHub Pages"
